[build]
  publish = "web/public"
  functions = "netlify/functions"
  command = "npm install --prefix web"

[functions]
  node_bundler = "esbuild"
  included_files = ["web/public/**", "web/server/**"]

# Route API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Route frontend static requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
